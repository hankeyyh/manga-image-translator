# Replicate V1 runtime baseline:
# - 推荐硬件: NVIDIA L4 (24GB 显存)
# - 备选硬件: NVIDIA T4 (16GB 显存, 更慢但成本更低)
# - 模型目录: /src/models
build:
  gpu: true
  python_version: "3.10"
  torch_version: "2.5.1"
  python_requirements: "requirements.replicate.txt"
  system_packages:
    - "ffmpeg"
    - "wget"
    - "unzip"
    - "libgl1"
    - "libglib2.0-0"
    - "libsm6"
    - "libxext6"
    - "libxrender1"

  run:
    - "mkdir -p /src/models/detection /src/models/inpainting /src/models/ocr"
    - "wget -nv -O /src/models/detection/comictextdetector.pt https://github.com/zyddnys/manga-image-translator/releases/download/beta-0.3/comictextdetector.pt"
    - "wget -nv -O /src/models/detection/comictextdetector.pt.onnx https://github.com/zyddnys/manga-image-translator/releases/download/beta-0.3/comictextdetector.pt.onnx"
    - "wget -nv -O /src/models/inpainting/inpainting_lama_mpe.ckpt https://github.com/zyddnys/manga-image-translator/releases/download/beta-0.3/inpainting_lama_mpe.ckpt"
    - "wget -nv -O /src/models/ocr/ocr_ar_48px.ckpt https://github.com/zyddnys/manga-image-translator/releases/download/beta-0.3/ocr_ar_48px.ckpt"
    - "wget -nv -O /src/models/ocr/alphabet-all-v7.txt https://github.com/zyddnys/manga-image-translator/releases/download/beta-0.3/alphabet-all-v7.txt"
predict: "predict.py:Predictor"
